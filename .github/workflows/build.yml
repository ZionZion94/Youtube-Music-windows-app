name: Build Windows

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build
        run: npx --yes @tauri-apps/cli@2 build

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: YouTube-Music-Setup
          path: src-tauri/target/release/bundle/nsis/*.exe

      # Version portable : l'application seule, sans installeur (moins souvent bloquée par
      # les filtres de téléchargement des navigateurs et par SmartScreen).
      - name: Prepare portable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force portable | Out-Null
          Copy-Item src-tauri/target/release/ytmusic-desktop.exe "portable/YouTube Music.exe"

      - name: Upload portable
        uses: actions/upload-artifact@v4
        with:
          name: YouTube-Music-Portable
          path: portable/*.exe

      # La Release ne contient que l'application Windows (installeur + portable).
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: YouTube Music ${{ github.ref_name }}
          body_path: .github/release-notes.md
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            portable/*.exe

  streamdeck-plugin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: streamdeck-plugin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci
      - run: npm run typecheck
      - run: npm run pack

      # Le plugin doit se charger sans planter (sans Stream Deck, il s'arrête proprement).
      - name: Smoke test
        run: |
          set +e
          timeout 5 node com.zionzion94.ytmusic.sdPlugin/bin/plugin.js
          code=$?
          if [ $code -ne 0 ] && [ $code -ne 124 ]; then echo "Le plugin a planté (code $code)"; exit 1; fi

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: StreamDeck-Plugin
          path: streamdeck-plugin/dist/*.streamDeckPlugin
